<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Node Control · Preview</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap');
  
  *{margin:0;padding:0;box-sizing:border-box}
  
  :root{
    --bg:#0a0e17;
    --surface:#111827;
    --surface2:#1a2235;
    --border:#1e2a3a;
    --text:#e2e8f0;
    --text2:#8892a4;
    --accent:#22d3ee;
    --accent2:#06b6d4;
    --green:#10b981;
    --red:#ef4444;
    --amber:#f59e0b;
    --radius:12px;
  }
  
  html{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
  
  body{
    max-width:540px;margin:0 auto;padding:20px 16px 40px;
    min-height:100vh;
  }
  
  .header{
    text-align:center;padding:28px 0 24px;
    border-bottom:1px solid var(--border);margin-bottom:24px;
  }
  .header h1{
    font-size:1.1rem;font-weight:700;letter-spacing:3px;
    text-transform:uppercase;color:var(--accent);
    margin-bottom:6px;
  }
  .header .sub{font-size:.7rem;color:var(--text2);letter-spacing:1px}
  
  .status-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;background:var(--surface);border-radius:var(--radius);
    margin-bottom:20px;font-size:.7rem;color:var(--text2);
    border:1px solid var(--border);
  }
  .status-bar .dot{
    width:7px;height:7px;border-radius:50%;display:inline-block;
    margin-right:6px;vertical-align:middle;
  }
  .dot-green{background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot-red{background:var(--red);box-shadow:0 0 8px var(--red)}
  
  .node-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;
    transition:all .2s ease;position:relative;overflow:hidden;
  }
  .node-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:var(--border);transition:background .3s ease;
  }
  .node-card.online::before{background:var(--green)}
  .node-card.offline{opacity:.5}
  .node-card.offline::before{background:var(--red)}
  
  .node-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .node-name{font-size:.85rem;font-weight:700;letter-spacing:1px}
  .node-badge{
    font-size:.6rem;padding:3px 10px;border-radius:20px;
    letter-spacing:1px;text-transform:uppercase;font-weight:600;
  }
  .badge-online{background:rgba(16,185,129,.15);color:var(--green)}
  .badge-offline{background:rgba(239,68,68,.12);color:var(--red)}
  .badge-pending{background:rgba(245,158,11,.12);color:var(--amber)}
  
  .node-meta{
    display:flex;gap:16px;font-size:.65rem;color:var(--text2);
    margin-bottom:16px;
  }
  
  .toggle-row{display:flex;align-items:center;justify-content:space-between}
  .toggle-label{font-size:.7rem;color:var(--text2);letter-spacing:.5px}
  
  .toggle{
    position:relative;width:52px;height:28px;cursor:pointer;
  }
  .toggle input{display:none}
  .toggle .slider{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:var(--surface2);border:1px solid var(--border);
    border-radius:28px;transition:all .25s ease;
  }
  .toggle .slider::before{
    content:'';position:absolute;width:20px;height:20px;
    border-radius:50%;background:var(--text2);
    top:3px;left:4px;transition:all .25s ease;
  }
  .toggle input:checked+.slider{
    background:rgba(16,185,129,.2);border-color:var(--green);
  }
  .toggle input:checked+.slider::before{
    transform:translateX(23px);background:var(--green);
    box-shadow:0 0 12px rgba(16,185,129,.5);
  }
  .toggle.disabled{opacity:.4;pointer-events:none}
  
  .actions{
    display:flex;gap:8px;margin-top:20px;
  }
  .btn{
    flex:1;padding:10px;border:1px solid var(--border);
    border-radius:var(--radius);background:var(--surface2);
    color:var(--text2);font-family:inherit;font-size:.65rem;
    letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    transition:all .15s ease;font-weight:600;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn:active{transform:scale(.97)}
  .btn-all-on{border-color:rgba(16,185,129,.3);color:var(--green)}
  .btn-all-on:hover{background:rgba(16,185,129,.1);border-color:var(--green)}
  .btn-all-off{border-color:rgba(239,68,68,.3);color:var(--red)}
  .btn-all-off:hover{background:rgba(239,68,68,.1);border-color:var(--red)}
  
  .footer{
    text-align:center;margin-top:28px;font-size:.6rem;
    color:var(--text2);opacity:.5;
  }
  
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .pending-anim{animation:pulse 1s ease-in-out infinite}
  
  .preview-banner{
    text-align:center;padding:8px;background:rgba(34,211,238,.1);
    border:1px solid rgba(34,211,238,.2);border-radius:var(--radius);
    margin-bottom:16px;font-size:.65rem;color:var(--accent);letter-spacing:.5px;
  }
</style>
</head>
<body>

<div class="preview-banner">PREVIEW MODE · Simulated data for demonstration</div>

<div class="header">
  <h1>⬡ Node Control</h1>
  <div class="sub">ESP-NOW Mesh Dashboard</div>
</div>

<div class="status-bar" id="statusBar">
  <span><span class="dot dot-green" id="connDot"></span> <span id="connText">Connected</span></span>
  <span id="clientCount">1 client</span>
</div>

<div id="nodeList"></div>

<div class="actions">
  <button class="btn btn-all-on" onclick="allNodes(true)">All On</button>
  <button class="btn btn-all-off" onclick="allNodes(false)">All Off</button>
  <button class="btn" onclick="discover()">Discover</button>
</div>

<div class="footer">Auto-refreshes every 2s · http://control.local</div>

<script>
// Simulated state for preview
let state = {
  nodes: [
    { id: 0, name: "Master", online: true, mosfet: false, uptime: 14523, registered: true },
    { id: 1, name: "Node 1", online: true, mosfet: true, uptime: 14200, registered: true, pending: false },
    { id: 2, name: "Node 2", online: true, mosfet: false, uptime: 13890, registered: true, pending: false },
    { id: 3, name: "Node 3", online: false, mosfet: false, uptime: 0, registered: true, pending: false },
    { id: 4, name: "Node 4", online: true, mosfet: true, uptime: 8432, registered: true, pending: false },
  ],
  clients: 1
};

function render() {
  const list = document.getElementById('nodeList');
  let html = '';

  state.nodes.forEach(n => {
    const online = n.online;
    const pending = n.pending || false;
    const upStr = formatUptime(n.uptime || 0);
    const statusClass = !online ? 'badge-offline' : pending ? 'badge-pending' : 'badge-online';
    const statusText = !online ? 'Offline' : pending ? 'Pending' : 'Online';

    html += `
      <div class="node-card ${online ? 'online' : 'offline'}">
        <div class="node-top">
          <span class="node-name">${n.id === 0 ? '⬡ Master' : '◇ Node ' + n.id}</span>
          <span class="node-badge ${statusClass} ${pending?'pending-anim':''}">${statusText}</span>
        </div>
        <div class="node-meta">
          <span>Uptime: ${upStr}</span>
          ${n.id === 0 ? '<span>Local</span>' : !n.registered ? '<span>Not discovered</span>' : ''}
        </div>
        <div class="toggle-row">
          <span class="toggle-label">MOSFET Power</span>
          <label class="toggle ${!online?'disabled':''}">
            <input type="checkbox" ${n.mosfet?'checked':''} 
                   onchange="toggleNode(${n.id},this.checked)" ${!online?'disabled':''}>
            <span class="slider"></span>
          </label>
        </div>
      </div>`;
  });

  list.innerHTML = html;
}

function toggleNode(id, newState) {
  const node = state.nodes.find(n => n.id === id);
  if (node) {
    node.mosfet = newState;
    // Simulate pending state briefly
    if (id !== 0) {
      node.pending = true;
      render();
      setTimeout(() => { node.pending = false; render(); }, 800);
    } else {
      render();
    }
  }
}

function allNodes(on) {
  state.nodes.forEach(n => {
    if (n.online) {
      n.mosfet = on;
      if (n.id !== 0) {
        n.pending = true;
      }
    }
  });
  render();
  setTimeout(() => {
    state.nodes.forEach(n => n.pending = false);
    render();
  }, 800);
}

function discover() {
  // Simulate node 3 coming online
  const n3 = state.nodes.find(n => n.id === 3);
  if (n3 && !n3.online) {
    setTimeout(() => {
      n3.online = true;
      n3.uptime = 5;
      render();
    }, 1500);
  }
}

function formatUptime(s) {
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s/60) + 'm ' + (s%60) + 's';
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

// Simulate uptime counting
setInterval(() => {
  state.nodes.forEach(n => { if (n.online) n.uptime++; });
  render();
}, 1000);

render();
</script>
</body>
</html>
